name: Documentation

on:
  push:
    branches: ["master"]
  # Pull requests build the docs but do not deploy them; the deploy job is
  # gated on a push to master. This replaces the `docs` job that ci.yml used
  # to run, which called this workflow on the same push that already
  # triggered it -- two runs, one pages concurrency group, and the loser was
  # cancelled. A cancelled run renders as a failing badge.
  pull_request:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Set permissions at the job level.
permissions: {}

jobs:
  build:
    name: Build documentation with Sphinx
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: 'pip'

      - run: |
          python -m pip install --upgrade pip
          python -m pip install . --group=docs
          python -m pip list

      - run: |
          sphinx-build --builder html docs/source/ docs/build/html

      - name: Upload artifact (only on push to master)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5
        with:
          path: './docs/build/html'

  deploy:
    name: Deploy documentation to GitHub Pages
    needs: build
    # Deploy only on push to master
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-slim
    # Only the deployment is serialised. Putting this at workflow level meant a
    # queued *build* could be cancelled too, which turned an ordinary pair of
    # merges into a failing documentation badge even though the docs built
    # fine. In-progress deployments are still allowed to finish.
    concurrency:
      group: "pages"
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
